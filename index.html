<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Sketch &amp; Paint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="26" height="26">
        <path d="M6 34 C 6 20, 10 8, 24 6 C 34 4.5, 37 12, 30 16 C 22 20.5, 16 15, 20 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <circle cx="30" cy="30" r="4.5" fill="currentColor"/>
      </svg>
    </span>
    <h1>Atelier</h1>
    <span class="brand-sub">sketch &amp; paint</span>
  </div>

  <div class="topbar-actions">
    <button class="btn-ghost" id="undoBtn" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Undo
    </button>
    <button class="btn-ghost" id="redoBtn" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Redo
    </button>
    <button class="btn-ghost" id="clearBtn" title="Clear canvas">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Clear
    </button>
    <button class="btn-solid" id="saveBtn" title="Save as PNG">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 4v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 11l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Save
    </button>
  </div>
</header>

<main class="workspace">

  <aside class="palette-rail" aria-label="Tools">

    <div class="rail-group">
      <span class="rail-label">Tool</span>
      <div class="tool-grid">
        <button class="tool-btn is-active" data-tool="brush" title="Brush">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 20c1-4 2-6 4-6s3 2 4 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 15 18 6c1-1 2.5-1 3.5 0 1 1 1 2.5 0 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="pencil" title="Pencil">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17 3l4 4-9.5 9.5H7L3 12.5 12.5 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 16.5 3.5 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 19 19 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="4" y="6" width="16" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <div class="rail-group">
      <span class="rail-label">Size <em id="sizeReadout">14</em></span>
      <input type="range" id="sizeSlider" min="1" max="80" value="14">
    </div>

    <div class="rail-group">
      <span class="rail-label">Opacity <em id="opacityReadout">100</em></span>
      <input type="range" id="opacitySlider" min="5" max="100" value="100">
    </div>

    <div class="rail-group">
      <span class="rail-label">Color</span>
      <div class="swatch-board" id="swatchBoard">
        <!-- swatches injected by JS -->
      </div>
      <label class="custom-color" title="Custom color">
        <input type="color" id="colorPicker" value="#1f4b5f">
        <span>Custom</span>
      </label>
    </div>

    <div class="rail-group brush-preview-group">
      <span class="rail-label">Preview</span>
      <div class="brush-preview-well">
        <span id="brushDot"></span>
      </div>
    </div>

  </aside>

  <section class="canvas-stage">
    <div class="easel">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="paintCanvas" width="1400" height="900"></canvas>
        <canvas id="overlayCanvas" width="1400" height="900"></canvas>
      </div>
    </div>
    <p class="hint">Left-click or touch to draw &middot; shapes preview live as you drag &middot; Ctrl/Cmd+Z to undo</p>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
